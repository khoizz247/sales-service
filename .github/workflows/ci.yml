name: Test sales service

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Unit, architecture, and MySQL Testcontainers tests
        run: bash ./mvnw -B verify
      - name: Configure disposable CI admin
        run: |
          password="Ci@$(openssl rand -hex 12)Aa1"
          echo "::add-mask::$password"
          echo "BOOTSTRAP_ADMIN_EMAIL=ci-admin@example.com" >> "$GITHUB_ENV"
          echo "BOOTSTRAP_ADMIN_PASSWORD=$password" >> "$GITHUB_ENV"
      - name: Start fresh MySQL and API
        run: docker compose up --build -d
      - name: Wait for API and verify Flyway schema
        run: |
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://localhost:8080/api/products > /dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail --silent --show-error http://localhost:8080/api/products > /dev/null
          docker compose exec -T mysql sh -c 'MYSQL_PWD="$MYSQL_PASSWORD" mysql -u"$MYSQL_USER" sales_service -N -e "SELECT COUNT(*) FROM flyway_schema_history WHERE success = 1"' | grep -x 3
          docker compose exec -T mysql sh -c 'MYSQL_PWD="$MYSQL_PASSWORD" mysql -u"$MYSQL_USER" sales_service -N -e "SHOW FULL TABLES"' | grep -v '^flyway_schema_history' | grep -c 'BASE TABLE' | grep -x 17
      - name: Verify concurrent purchases against MySQL
        run: python3 scripts/concurrent_order_test.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Postman collection with Newman
        run: |
          npx --yes newman@6.2.2 run docs/sales-service.postman_collection.json \
            --env-var "baseUrl=http://localhost:8080" \
            --env-var "adminEmail=$BOOTSTRAP_ADMIN_EMAIL" \
            --env-var "adminPassword=$BOOTSTRAP_ADMIN_PASSWORD" \
            --bail
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --tail=100
      - name: Stop services
        if: always()
        run: docker compose down
