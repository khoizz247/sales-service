services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: sales_service
      MYSQL_USER: ${MYSQL_USER:-sales_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-sales_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/02_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
      - ./scripts/mysql-healthcheck.sh:/usr/local/bin/mysql-healthcheck.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "sh /usr/local/bin/mysql-healthcheck.sh"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  api:
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      DB_URL: jdbc:mysql://mysql:3306/sales_service?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: ${MYSQL_USER:-sales_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-sales_password}
      JWT_SECRET: ${JWT_SECRET:-c2FsZXMtc2VydmljZS1kZXYtc2VjcmV0LWNoYW5nZS1tZS0xMjM0NTY=}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
    ports:
      - "${API_HOST_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://127.0.0.1:8080/api/products > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  mysql_data:
